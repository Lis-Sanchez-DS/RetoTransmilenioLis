name: Recolectar observaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar modelos desde Supabase Storage
        shell: bash
        run: |
          mkdir -p models/xgboost
          for station in 02300 03000 05000 05100 06000 06111 07105 07107 07111 09000 09122 10009; do
            curl --fail --silent --show-error \\
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \\
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \\
              "$SUPABASE_URL/storage/v1/object/models/xgboost/xgboost_${station}.joblib" \\
              -o "models/xgboost/xgboost_${station}.joblib"
          done

      - name: Ejecutar collector
        run: python -m app.collector
