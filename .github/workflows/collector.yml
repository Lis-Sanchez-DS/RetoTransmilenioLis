name: Recolectar observaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub's cron has no SLA and can be delayed well past its 30-minute
    # interval under load, so this job polls internally for ~5.75h instead
    # of relying on the next scheduled tick. The concurrency group above
    # queues (not skips) any scheduled run that fires meanwhile, so as soon
    # as this loop ends the next one picks up immediately.
    timeout-minutes: 355
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar modelos desde Supabase Storage
        shell: bash
        run: |
          mkdir -p models/xgboost
          for station in 02300 03000 05000 05100 06000 06111 07105 07107 07111 09000 09122 10009; do
            curl --fail --silent --show-error \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/storage/v1/object/models/xgboost/xgboost_${station}.joblib" \
              -o "models/xgboost/xgboost_${station}.joblib"
          done

      - name: Ejecutar collector cada 30 minutos mientras el job siga vivo
        shell: bash
        run: |
          set +e
          end=$(( $(date +%s) + 345 * 60 ))
          fails=0
          while [ "$(date +%s)" -lt "$end" ]; do
            python -m app.collector
            status=$?
            if [ $status -eq 75 ]; then
              echo "Servidor PulsoTransmi no disponible; no cuenta como fallo de la app. Reintentando en 5 min."
              sleep 300
              continue
            fi
            if [ $status -ne 0 ]; then
              fails=$((fails + 1))
              echo "Intento fallido ($fails consecutivo(s))."
              if [ $fails -ge 3 ]; then
                echo "3 fallos consecutivos: se detiene el job para que quede visible en Actions."
                exit 1
              fi
            else
              fails=0
            fi
            sleep 1800
          done
