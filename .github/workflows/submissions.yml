name: Enviar predicciones

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: submissions
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    # GitHub's cron has no SLA and can be delayed well past its 5-minute
    # interval under load, so this job polls internally for ~5.75h instead
    # of relying on the next scheduled tick. The concurrency group above
    # queues (not skips) any scheduled run that fires meanwhile, so as soon
    # as this loop ends the next one picks up immediately.
    timeout-minutes: 355
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar modelos desde Supabase Storage
        shell: bash
        run: scripts/download_models.sh

      - name: Enviar submission cada 20 minutos mientras el job siga vivo
        shell: bash
        run: |
          set +e
          end=$(( $(date +%s) + 345 * 60 ))
          fails=0
          while [ "$(date +%s)" -lt "$end" ]; do
            # Re-descargar antes de cada vuelta: si collector.yml reentrenó y
            # republicó un modelo por drift a mitad de este job (que vive
            # hasta ~5.75h), esto lo recoge en la siguiente vuelta en vez de
            # seguir usando el modelo viejo hasta que el job se reinicie.
            if ! scripts/download_models.sh; then
              echo "No se pudieron refrescar los modelos; se sigue con la copia local ya descargada."
            fi
            python -m app.submit_xgboost
            status=$?
            if [ $status -eq 75 ]; then
              echo "Servidor PulsoTransmi no disponible; no cuenta como fallo de la app. Reintentando en 5 min."
              sleep 300
              continue
            fi
            if [ $status -ne 0 ]; then
              fails=$((fails + 1))
              echo "Intento fallido ($fails consecutivo(s))."
              if [ $fails -ge 3 ]; then
                echo "3 fallos consecutivos: se detiene el job para que quede visible en Actions."
                exit 1
              fi
            else
              fails=0
            fi
            sleep 1200
          done
