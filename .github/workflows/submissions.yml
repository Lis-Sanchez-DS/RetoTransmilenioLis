name: Enviar predicciones

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: submissions
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    # DOS replicas en runners distintos (2026-10-04): un runner sin ruta al servidor
    # de Pulso dejo el unico submitter 67 min sin entregar y se perdieron 2 ciclos
    # mientras otro runner arrancado a la vez funcionaba bien. La segunda replica solo
    # cuesta CPU de Actions (repo publico) y es inocua: si las dos entregan, la
    # segunda recibe 409 (ya entregado) y el ledger evita trabajo repetido.
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    # GitHub's cron has no SLA and can be delayed well past its 5-minute
    # interval under load, so this job polls internally for ~5.75h instead
    # of relying on the next scheduled tick. The concurrency group above
    # queues (not skips) any scheduled run that fires meanwhile, so as soon
    # as this loop ends the next one picks up immediately.
    timeout-minutes: 355
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
      REPLICA: ${{ matrix.replica }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar modelos desde Supabase Storage
        shell: bash
        run: |
          # Un 502 aislado de Supabase Storage no debe matar el job entero
          # (2026-10-02): reintenta el paso completo antes de rendirse.
          for attempt in 1 2 3 4; do
            if scripts/download_models.sh; then
              exit 0
            fi
            echo "Descarga de modelos fallo (intento $attempt/4); reintentando en 30s"
            sleep 30
          done
          exit 1

      - name: Enviar submission cada 5 minutos mientras el job siga vivo
        shell: bash
        run: |
          set +e
          end=$(( $(date +%s) + 345 * 60 ))
          fails=0
          outage=0
          # La replica 2 se desfasa 150 s: entre las dos se consulta cada ~2.5 min.
          if [ "$REPLICA" = "2" ]; then sleep 150; fi
          while [ "$(date +%s)" -lt "$end" ]; do
            # Re-descargar antes de cada vuelta: si collector.yml reentrenó y
            # republicó un modelo por drift a mitad de este job (que vive
            # hasta ~5.75h), esto lo recoge en la siguiente vuelta en vez de
            # seguir usando el modelo viejo hasta que el job se reinicie.
            if ! timeout 300 scripts/download_models.sh; then
              echo "No se pudieron refrescar los modelos; se sigue con la copia local ya descargada."
            fi
            # timeout: una llamada colgada (red/BD) no debe dejar el job "vivo"
            # sin enviar nada; 124 cuenta como fallo y a los 3 el job se detiene.
            timeout 600 python -m app.submit_xgboost
            status=$?
            if [ $status -eq 75 ]; then
              # El servidor de Pulso no responde DESDE ESTE RUNNER. Antes se
              # reintentaba para siempre sin contar fallos: el 2026-10-04 un runner
              # sin ruta al servidor estuvo 67 min en este bucle y se perdieron 2
              # ciclos. Tras 3 vueltas seguidas (~4 min) el job se detiene (visible en
              # Actions) y el siguiente run en cola arranca en un runner nuevo.
              outage=$((outage + 1))
              echo "::warning::Servidor PulsoTransmi no responde desde este runner (vuelta $outage consecutiva)."
              if [ $outage -ge 3 ]; then
                echo "::error::Sin respuesta del servidor tras $outage vueltas (~4 min): se detiene el job para que un runner nuevo tome el relevo."
                exit 1
              fi
              sleep 30
              continue
            fi
            outage=0
            if [ $status -eq 76 ]; then
              # Collector atrasado: ya se emitio ::warning::; no es un fallo del submitter.
              fails=0
            elif [ $status -ne 0 ]; then
              fails=$((fails + 1))
              echo "Intento fallido ($fails consecutivo(s))."
              if [ $fails -ge 3 ]; then
                echo "3 fallos consecutivos: se detiene el job para que quede visible en Actions."
                exit 1
              fi
            else
              fails=0
            fi
            sleep 300
          done
