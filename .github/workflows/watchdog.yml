name: Vigilante de ciclos

# Red de seguridad INDEPENDIENTE del submitter (submissions.yml). El 2026-10-04 el
# submitter estuvo 67 min en un runner sin ruta al servidor de Pulso, sin fallar, y se
# perdieron 2 ciclos. Este job vive ~5.75 h en OTRO runner y cada 2 min revisa (solo
# biblioteca estandar, ~1-10 s) si hay un ciclo abierto hace mas de 5 min que el ledger
# (collector_state 'last_submission') no lista como entregado; si lo hay, lo entrega el
# mismo. Es un bucle interno (como los otros workflows) y no depende del cron de
# GitHub, que no tiene SLA: en el primer dia el cron de este workflow tardo >35 min en
# disparar. En operacion normal no instala nada ni descarga modelos (no repite el
# incidente de egress de Supabase). Si tuvo que intervenir, el job TERMINA EN ROJO al
# final (Actions envia correo) y deja un ::error:: en el momento.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vigilar ciclos mientras el job siga vivo
        shell: bash
        run: |
          set +e
          end=$(( $(date +%s) + 345 * 60 ))
          prepared=0
          interventions=0
          out="${RUNNER_TEMP:-/tmp}/watch.out"
          while [ "$(date +%s)" -lt "$end" ]; do
            : > "$out"
            GITHUB_OUTPUT="$out" python scripts/cycle_watch.py
            if grep -q '^needed=true' "$out"; then
              interventions=$((interventions + 1))
              closes_at=$(grep '^closes_at=' "$out" | cut -d= -f2)
              cycle_id=$(grep '^cycle_id=' "$out" | cut -d= -f2)
              echo "::error::El submitter NO entrego el ciclo $cycle_id a tiempo; lo entrega el vigilante. Revisar 'Enviar predicciones'."
              if [ "$prepared" -eq 0 ]; then
                # Solo la primera vez que hace falta: dependencias y modelos.
                pip install -r requirements.txt
                for attempt in 1 2 3 4; do
                  if scripts/download_models.sh; then break; fi
                  echo "Descarga de modelos fallo (intento $attempt/4); reintentando en 15s"
                  sleep 15
                done
                prepared=1
              fi
              deadline=$(date -d "$closes_at" +%s)
              while [ "$(date +%s)" -lt $(( deadline - 20 )) ]; do
                timeout 300 python -m app.submit_xgboost
                if python scripts/cycle_watch.py --until-delivered; then
                  break
                fi
                sleep 30
              done
            fi
            sleep 120
          done
          if [ "$interventions" -gt 0 ]; then
            echo "::error::El vigilante tuvo que intervenir $interventions vez/veces: el submitter principal fallo."
            exit 1
          fi
