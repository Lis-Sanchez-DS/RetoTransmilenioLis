services:
  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    environment:
      DATABASE_URL: ${SUPABASE_DATABASE_URL:?Set SUPABASE_DATABASE_URL in .env}
      COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-7200}

  collector:
    build: .
    command: ["python", "-m", "app.collector"]
    environment:
      DATABASE_URL: ${SUPABASE_DATABASE_URL:?Set SUPABASE_DATABASE_URL in .env}
      PULSO_API_URL: ${PULSO_API_URL:-https://pulso-transmi.72-60-245-2.sslip.io}
    volumes:
      - ./models:/app/models

  prediction_scheduler:
    build: .
    command: ["python", "-m", "app.prediction_scheduler"]
    env_file:
      - .env
    environment:
      PULSO_API_URL: ${PULSO_API_URL:-https://pulso-transmi.72-60-245-2.sslip.io}
      PREDICTION_INTERVAL_SECONDS: ${PREDICTION_INTERVAL_SECONDS:-300}
    volumes:
      - ./models:/app/models
